[project]
name = "signalpay-contracts"
version = "0.1.0"
description = "Python client primitives for SignalPay payment contracts."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signalpay_contracts"]
